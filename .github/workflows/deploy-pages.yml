name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate required site files
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -d assets/img
          test -d assets/fonts
          ! grep -R "/Users/" index.html styles.css app.js

      - name: Assemble deployment artifact
        shell: bash
        run: |
          mkdir -p _site
          cp index.html styles.css app.js robots.txt .nojekyll _site/
          cp -R assets _site/assets

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
